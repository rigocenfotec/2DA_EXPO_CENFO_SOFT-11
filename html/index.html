<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Showcase</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
        .bmw-image {
            border-radius: 8px;
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .bmw-image:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Welcome to BMW Showcase</h1>
        
        <div class="row">
            <!-- Imagen 001 -->
            <div class="col-md-4">
                <div class="card">
                    <img src="Bootstrap/img/imagenes/bmw_imagen_001.png" 
                         alt="BMW Model 001" 
                         class="card-img-top bmw-image">
                    <div class="card-body">
                        <h5 class="card-title">BMW Model 001</h5>
                    </div>
                </div>
            </div>
            
            <!-- Imagen 002 -->
            <div class="col-md-4">
                <div class="card">
                    <img src="Bootstrap/img/imagenes/bmw_imagen_002.png" 
                         alt="BMW Model 002" 
                         class="card-img-top bmw-image">
                    <div class="card-body">
                        <h5 class="card-title">BMW Model 002</h5>
                    </div>
                </div>
            </div>
            
            <!-- Imagen 003 -->
            <div class="col-md-4">
                <div class="card">
                    <img src="Bootstrap/img/imagenes/bmw_imagen_003.png" 
                         alt="BMW Model 003" 
                         class="card-img-top bmw-image">
                    <div class="card-body">
                        <h5 class="card-title">BMW Model 003</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
